name: Visual QA

# Update 1.5: builds the app, boots a simulator, installs + launches it and
# captures screenshots in light AND dark mode. Screenshots are uploaded as
# a workflow artifact and attached to v* releases, so the glossy-card
# rework can be visually verified — not just assumed — on every build.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Simulator screenshots (light + dark)
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer" || true
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          # Prefer an iPhone simulator; fall back to any device.
          DEST_ID="$(xcrun simctl list devices available 2>/dev/null \
            | grep -m1 -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' || true)"
          # Prefer one whose line mentions iPhone if possible.
          IPHONE_ID="$(xcrun simctl list devices available 2>/dev/null \
            | grep 'iPhone' | grep -m1 -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' || true)"
          if [ -n "$IPHONE_ID" ]; then DEST_ID="$IPHONE_ID"; fi
          if [ -z "$DEST_ID" ]; then
            echo "No simulator available — cannot verify visually."
            exit 1
          fi
          echo "device=$DEST_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEST_ID" || true
          xcrun simctl bootstatus "$DEST_ID" -b

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project TeliaSalesAssistantPro.xcodeproj \
            -scheme TeliaSalesAssistantPro \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device }}" \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Install, launch and screenshot (light)
        run: |
          set -euo pipefail
          APP="dd/Build/Products/Debug-iphonesimulator/TeliaSalesAssistantPro.app"
          test -d "$APP"
          xcrun simctl install "${{ steps.sim.outputs.device }}" "$APP"
          xcrun simctl ui "${{ steps.sim.outputs.device }}" appearance light
          xcrun simctl launch "${{ steps.sim.outputs.device }}" se.sthlm.teliacoachpro
          sleep 12   # first launch: seed import + first layout pass
          xcrun simctl io "${{ steps.sim.outputs.device }}" screenshot screenshots/dashboard-light.png
          # A second capture a moment later catches settled animations
          # (the diagonal reflection sweep animates on selection).
          sleep 3
          xcrun simctl io "${{ steps.sim.outputs.device }}" screenshot screenshots/dashboard-light-2.png

      - name: Screenshot (dark)
        run: |
          set -euo pipefail
          xcrun simctl ui "${{ steps.sim.outputs.device }}" appearance dark
          sleep 4
          xcrun simctl io "${{ steps.sim.outputs.device }}" screenshot screenshots/dashboard-dark.png
          xcrun simctl terminate "${{ steps.sim.outputs.device }}" se.sthlm.teliacoachpro || true

      - name: Verify screenshots exist and are non-trivial
        run: |
          set -euo pipefail
          ls -la screenshots/
          for f in screenshots/*.png; do
            # Each screenshot must be a real PNG > 30 KB (not a black frame).
            SIZE=$(stat -f%z "$f")
            if [ "$SIZE" -lt 30000 ]; then
              echo "::warning::$f is only $SIZE bytes — possibly a blank capture"
            fi
            file "$f"
          done

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Attach screenshots to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: screenshots/*.png

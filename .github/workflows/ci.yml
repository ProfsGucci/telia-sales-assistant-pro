name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Core logic (pricing, engines, persistence models) on Linux Swift.
  # This is the same target that `swift test` runs locally — no Apple SDK needed.
  core-tests-linux:
    name: Core unit tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run core tests
        run: swift test

  # Full app: build + unit tests on a simulator, then an unsigned IPA
  # for SideStore. The IPA is NOT signed — SideStore signs it on device.
  ios-build:
    name: iOS build, tests & unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60
    # Required for the release step (softprops) to attach the IPA on v* tags.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications/ | grep Xcode || true
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer" || true
          xcodebuild -version

      - name: Pick an available iOS simulator
        id: sim
        run: |
          set -euo pipefail
          # Lists (and auto-creates) schemes; shows destinations in the format:
          #   { platform:iOS Simulator, arch:arm64, id:ABCD-1234..., OS:18.2, name:iPhone 16 }
          # Freshly booted runners can return an empty list on the first call — retry.
          xcodebuild -project TeliaSalesAssistantPro.xcodeproj -list || true
          DEST_ID=""
          for attempt in 1 2 3 4 5; do
            LINE="$(xcodebuild -project TeliaSalesAssistantPro.xcodeproj -scheme TeliaSalesAssistantPro -showdestinations 2>/dev/null \
              | grep 'platform:iOS Simulator' | grep -v 'Placeholder' | grep -m1 'name:iPhone' || true)"
            if [ -z "$LINE" ]; then
              LINE="$(xcodebuild -project TeliaSalesAssistantPro.xcodeproj -scheme TeliaSalesAssistantPro -showdestinations 2>/dev/null \
                | grep 'platform:iOS Simulator' | grep -v 'Placeholder' | head -n1 || true)"
            fi
            if [ -n "$LINE" ]; then
              DEST_ID="$(printf '%s' "$LINE" | sed -n 's/.*id:\([-A-F0-9a-f]*\).*/\1/p')"
            fi
            if [ -n "$DEST_ID" ]; then break; fi
            echo "attempt $attempt: no simulator destination yet, retrying in 10s..."
            sleep 10
          done
          if [ -z "$DEST_ID" ]; then
            # Fallback: any available simulator device via simctl.
            DEST_ID="$(xcrun simctl list devices available 2>/dev/null \
              | grep -m1 -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' || true)"
          fi
          if [ -n "$DEST_ID" ]; then
            echo "destination=platform=iOS Simulator,id=$DEST_ID" >> "$GITHUB_OUTPUT"
            echo "has_sim=true" >> "$GITHUB_OUTPUT"
          else
            echo "destination=generic/platform=iOS Simulator" >> "$GITHUB_OUTPUT"
            echo "has_sim=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Build (simulator)
        run: |
          set -o pipefail
          xcodebuild -project TeliaSalesAssistantPro.xcodeproj \
            -scheme TeliaSalesAssistantPro \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Unit tests (simulator)
        if: steps.sim.outputs.has_sim == 'true'
        run: |
          set -o pipefail
          xcodebuild -project TeliaSalesAssistantPro.xcodeproj \
            -scheme TeliaSalesAssistantPro \
            -configuration Debug \
            -destination '${{ steps.sim.outputs.destination }}' \
            -parallel-testing-enabled NO \
            test

      - name: Build unsigned release IPA (generic iOS device)
        env:
          IPA_NAME: TeliaSalesAssistantPro-unsigned.ipa
        run: |
          set -o pipefail
          xcodebuild -project TeliaSalesAssistantPro.xcodeproj \
            -scheme TeliaSalesAssistantPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

          APP="dd/Build/Products/Release-iphoneos/TeliaSalesAssistantPro.app"
          test -d "$APP"
          rm -rf Payload "$IPA_NAME"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$IPA_NAME" Payload
          unzip -l "$IPA_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeliaSalesAssistantPro-unsigned
          path: TeliaSalesAssistantPro-unsigned.ipa
          if-no-files-found: error

      - name: Attach IPA to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TeliaSalesAssistantPro-unsigned.ipa
